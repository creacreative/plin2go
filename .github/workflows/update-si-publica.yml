name: Actualizeaza preturile si publica site-ul

on:
  schedule:
    - cron: '0 * * * *'  # la fiecare ora, in minutul 0
  workflow_dispatch:       # buton manual "Run workflow" in tab-ul Actions
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  actualizare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ruleaza scraperele
        run: |
          node scrape/fetch-all.js
          node scrape/fetch-istoric.js
      - name: Salveaza datele noi in repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data.js site/data.json site/istoric.js site/istoric.json
          git diff --cached --quiet || git commit -m "Actualizare automata preturi"
          git push

  publica:
    needs: actualizare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
